name: Ginseng Strip GTA - PSP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-psp:
    name: Build Ginseng Strip GTA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Ginseng Strip GTA project:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Build PSP game
        run: |
          if [ -f "./build-psp.sh" ]; then
            chmod +x ./build-psp.sh
            ./build-psp.sh
          else
            echo "::error::build-psp.sh fehlt im Repository."
            echo "Lege dein echtes PSP-Build-Skript als build-psp.sh ins Repository."
            exit 1
          fi

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: Ginseng Strip GTA - PSP Build
          path: dist/
          if-no-files-found: error
          retention-days: 30
