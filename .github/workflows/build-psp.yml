name: Ginseng Strip GTA - PSP Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Ginseng Strip GTA for PSP
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PSP toolchain
        shell: bash
        run: |
          set -e

          echo "=== PSPDEV TOOLCHAIN ==="
          psp-gcc --version

          echo "=== PSPSDK ==="
          psp-config --pspsdk-path

          echo "=== pack-pbp ==="
          command -v pack-pbp

          echo "=== mksfoex ==="
          command -v mksfoex

          echo "PSP toolchain check OK."

      - name: Find project directory
        shell: bash
        run: |
          set -e

          echo "=== SEARCHING FOR MAKEFILE ==="

          PROJECT_DIR=""

          if [ -f "./Makefile" ]; then
            PROJECT_DIR="."
          else
            for dir in ./*; do
              if [ -d "$dir" ] && [ -f "$dir/Makefile" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Makefile could not be found."
            echo "=== REPOSITORY CONTENT ==="
            find . -maxdepth 4 -print
            exit 1
          fi

          echo "Project directory found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify game project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking project files..."

          test -f Makefile || {
            echo "ERROR: Makefile is missing!"
            exit 1
          }

          test -f src/main.c || {
            echo "ERROR: src/main.c is missing!"
            exit 1
          }

          test -f build-psp.sh || {
            echo "ERROR: build-psp.sh is missing!"
            exit 1
          }

          test -d include || {
            echo "ERROR: include/ directory is missing!"
            exit 1
          }

          test -d assets || {
            echo "ERROR: assets/ directory is missing!"
            exit 1
          }

          test -d data || {
            echo "ERROR: data/ directory is missing!"
            exit 1
          }

          echo "PROJECT STRUCTURE OK"

      - name: Build PSP game
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x build-psp.sh

          echo "=== BUILDING GINSENG STRIP GTA ==="

          ./build-psp.sh

      - name: Validate EBOOT.PBP
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking EBOOT.PBP..."

          test -f dist/EBOOT.PBP || {
            echo "ERROR: dist/EBOOT.PBP was not created!"
            exit 1
          }

          test -s dist/EBOOT.PBP || {
            echo "ERROR: EBOOT.PBP is empty!"
            exit 1
          }

          SIZE=$(wc -c < dist/EBOOT.PBP)

          echo "EBOOT.PBP size: ${SIZE} bytes"

          if [ "$SIZE" -lt 65536 ]; then
            echo "ERROR: EBOOT.PBP is unexpectedly small!"
            exit 1
          fi

          echo "EBOOT.PBP file check OK."

      - name: Show build result
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "GINSENG STRIP GTA PSP BUILD COMPLETE"
          echo "======================================"

          ls -lh dist/EBOOT.PBP

      - name: Upload PSP game
        uses: actions/upload-artifact@v4
        with:
          name: Ginseng-Strip-GTA-PSP
          path: ${{ env.PROJECT_DIR }}/dist/EBOOT.PBP
          if-no-files-found: error
          retention-days: 30
